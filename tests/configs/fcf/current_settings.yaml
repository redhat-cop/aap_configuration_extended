---
controller_settings:
  - settings:
      TOWER_URL_BASE: "https://aap-all-in-one.iam.lab:444"
      LICENSE:
        account_number: '7777777'
        instance_count: 5
        license_date: '7777777777'
        license_type: enterprise
        pool_id: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
        product_name: AAP
        satellite: false
        sku: XXXXXXXXX
        subscription_id: '77777777'
        subscription_name: AAP
        support_level: Self-Support
        trial: false
        usage: Development/Test
        valid_key: true
      INSTALL_UUID: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
      AWX_TASK_ENV:
        GIT_SSL_NO_VERIFY: 'true'
      INSIGHTS_TRACKING_STATE: "false"
      CLEANUP_HOST_METRICS_LAST_TS: "2024-10-03T10:54:53.014166Z"
      HOST_METRIC_SUMMARY_TASK_LAST_TS: "2024-10-03T11:24:55.095157Z"
      PENDO_TRACKING_STATE: "off"
      AUTH_LDAP_SERVER_URI: "ldap://ldap.example.com"
      AUTH_LDAP_BIND_PASSWORD: "$encrypted$"
      AUTH_LDAP_START_TLS: "true"
      AUTH_LDAP_USER_SEARCH:
        - OU=Users,DC=example,DC=com
        - SCOPE_SUBTREE
        - (cn=%(user)s)
      AUTH_LDAP_USER_DN_TEMPLATE: "uid=%(user)s,ou=Users,dc=example,dc=com"
      AUTH_LDAP_USER_ATTR_MAP:
        email: examplePrimaryMail
        first_name: displayName
        last_name: sn
      AUTH_LDAP_GROUP_SEARCH:
        - dc=example,dc=com
        - SCOPE_SUBTREE
        - (objectClass=person)
      AUTH_LDAP_GROUP_TYPE: "GroupOfUniqueNamesType"
      AUTH_LDAP_GROUP_TYPE_PARAMS:
        {}
      AUTH_LDAP_REQUIRE_GROUP: "cn=satellite-qe,ou=adhoc,ou=managedGroups,dc=example,dc=com"
      AUTH_LDAP_USER_FLAGS_BY_GROUP:
        is_superuser:
          - cn=sat-qe-infra,ou=adhoc,ou=managedGroups,dc=example,dc=com
      AUTH_LDAP_ORGANIZATION_MAP:
        Satellite:
          users: true
      AUTH_LDAP_TEAM_MAP:
        satellite-qe:
          organization: Satellite
          users: true
        satlab-admin:
          organization: Satellite
          users: cn=sat-qe-infra,ou=adhoc,ou=managedGroups,dc=example,dc=com
...
