---
controller_credential_types:
  - name: Kerberos
    kind: cloud
    inputs:
      fields:
        - id: username
          type: string
          label: Username
        - id: password
          type: string
          label: Password
          secret: true
        - id: default_realm
          type: string
          label: Default Realm
        - id: kdc
          type: string
          label: KDC
          help_text: Optional KDC, use only if KDC DNS lookup not working
      required:
        - username
        - password
        - default_realm
    injectors:
      env:
        KRB5_CONFIG: !unsafe '{{ tower.filename }}'
      file:
        template: !unsafe |-
          [libdefaults]
          default_realm = {{ default_realm | upper }}
          dns_canonicalize_hostname = fallback
          dns_lookup_kdc = {% if kdc %}false{% else %}true{% endif %}
          dns_lookup_realm = true
          forwardable = true
          rdns = false
          [realms]
          {{ default_realm | upper }} = {
          {% if kdc %}kdc = {{ kdc }}{% endif %}
          }
          [domain_realm]
          {{ default_realm | lower }} = {{ default_realm | upper }}
      extra_vars:
        ansible_user: !unsafe '{{ username }}'
        ansible_password: !unsafe '{{ password }}'
...
