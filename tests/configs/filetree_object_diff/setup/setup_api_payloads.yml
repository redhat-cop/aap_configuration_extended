      organization: "{{ orgs }}"
      inventory: "{{ object_diff_shared_inventory }}"
      source: scm
      source_project: Object Diff Shared Project
      source_path: ""
      overwrite: true
      update_on_launch: false
  controller_templates:
    - name: Object Diff Orphan Job Template
      organization: "{{ orgs }}"
      project: Shared Project
      inventory: "{{ object_diff_shared_inventory }}"
      playbook: helloworld.yml
      job_type: run
  controller_workflows:
    - name: Object Diff Orphan Workflow
      organization: "{{ orgs }}"
  controller_schedules:
    - name: Object Diff Orphan Schedule
      unified_job_template: Object Diff Shared Job Template
      rrule: "DTSTART:20260101T000000Z RRULE:FREQ=DAILY;INTERVAL=1"

