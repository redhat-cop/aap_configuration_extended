---
# Metadata for object_diff integration tests (setup + validation order).
# Each type defines shared / CaC-only / orphan names and dispatch mapping.
object_diff_types:
  - label: organizations
    var: aap_organizations
    id_field: name
    api_path: api/controller/v2/organizations
    org_scoped: false
    dispatch_var: aap_organizations
    dispatch_role: gateway_organizations
    dispatch_tag: controller_organizations
    shared: Object Diff Shared Organization
    cac_only: Object Diff New CaC Organization
    orphan: Object Diff Orphan Organization
    scope: global
    skip_apply: true
    skip_object_diff: true

  - label: credential_types
    var: controller_credential_types
    cac_only: Object Diff New CaC Credential Type
    orphan: Object Diff Orphan Credential Type
    scope: global
    skip_apply: true
    skip_object_diff: true

