---
- name: Store diff snapshot | {{ od_type.label }}
  ansible.builtin.set_fact:
    __od_diff: "{{ lookup('vars', od_type.var, default=[]) }}"
    __od_validate_delta: >-
      {{
        not (od_type.roles_mode | default(false))
        and not (od_type.skip_apply | default(false))
        and not (od_type.skip_setup | default(false))
        and not (od_type.skip_object_diff | default(false))
      }}

- name: Skip validation for roles | {{ od_type.label }}
  when: od_type.roles_mode | default(false)
  block:
    - name: Assert diff is defined | {{ od_type.label }}
      ansible.builtin.assert:
        that:
          - __od_diff is defined
          - __od_diff is iterable

- name: Skip validation for setup-only or excluded types | {{ od_type.label }}
  when: od_type.skip_apply | default(false) or od_type.skip_setup | default(false) or od_type.skip_object_diff | default(false)
  block:
    - name: Assert API pre-test state when setup ran | {{ od_type.label }}
      ansible.builtin.assert:
        that:
          - od_type.shared in __od_api_before[od_type.label]
          - od_type.cac_only not in __od_api_before[od_type.label]
          - od_type.orphan in __od_api_before[od_type.label]
        success_msg: "{{ od_type.label }} API pre-test state verified (diff/apply skipped)"
      when:
        - not (od_type.skip_setup | default(false))
        - not (od_type.skip_apply | default(false))
        - not (od_type.assignments_mode | default(false))
        - __od_api_before is defined
        - od_type.label in __od_api_before

    - name: Assert object_diff output is defined | {{ od_type.label }}
      ansible.builtin.assert:
        that:
          - __od_diff is defined
          - __od_diff is iterable
      when: od_type.skip_setup | default(false) or od_type.skip_object_diff | default(false)

- name: Validate Gateway assignment delta | {{ od_type.label }}
  when:
    - __od_validate_delta | bool
    - od_type.assignments_mode | default(false)
  block:
    - name: Resolve expected assignment ids | {{ od_type.label }}
      ansible.builtin.set_fact:
        __od_shared_id: "{{ od_type.shared_match.role_definition }}|{{ od_type.shared_match.user }}|{{ od_type.shared_match.object_name }}"
        __od_orphan_id: "{{ od_type.orphan_match.role_definition }}|{{ od_type.orphan_match.user }}|{{ od_type.orphan_match.object_name }}"
        __od_cac_only_id: "{{ od_type.cac_only_match.role_definition }}|{{ od_type.cac_only_match.user }}|{{ od_type.cac_only_match.object_name }}"

    - name: Show assignment diff | {{ od_type.label }}
      ansible.builtin.debug:
        msg: "{{ __od_diff }}"

    - name: Expect CaC-only present and orphan absent | {{ od_type.label }}
      ansible.builtin.assert:
        that:
          - __od_orphan_id in __od_api_before[od_type.label]
          - __od_cac_only_id not in __od_api_before[od_type.label]
          - (__od_absent_matches | length) == 1
          - (__od_present_matches | length) == 1
        fail_msg: >-
          Assignment delta mismatch for {{ od_type.label }}.
          orphan_id={{ __od_orphan_id }} cac_only_id={{ __od_cac_only_id }}
          api_before={{ __od_api_before[od_type.label] | default([]) }}
          diff={{ __od_diff }}
      vars:
        __od_absent_matches: >-
          {{
            __od_diff
            | selectattr('state', 'defined')
            | selectattr('state', 'equalto', 'absent')
            | selectattr('role_definition', 'equalto', od_type.orphan_match.role_definition)
            | selectattr('user', 'equalto', od_type.orphan_match.user)
            | list
          }}
        __od_present_matches: >-
          {{
            __od_diff
            | selectattr('state', 'defined')
            | selectattr('state', 'equalto', 'present')
            | selectattr('role_definition', 'equalto', od_type.cac_only_match.role_definition)
            | selectattr('user', 'equalto', od_type.cac_only_match.user)
            | list
          }}

- name: Validate filetree delta | {{ od_type.label }}
  when:
    - __od_validate_delta | bool
    - not (od_type.assignments_mode | default(false))
  ansible.builtin.include_tasks: filetree_object_diff_validate_named_type.yml
...
