---
- name: Test Kerberos credential type export and import
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    template_overrides_resources:
      credential_type: {}
    template_overrides_global:
      credential_type: {}
  tasks:
    - name: Load API-shaped Kerberos injectors mock
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/configs/fcf/kerberos_injectors_api_mock.yaml"

    - name: Build mock credential type from API
      ansible.builtin.set_fact:
        current_credential_types_asset_value:
          - name: Kerberos
            kind: cloud
            managed: false
            inputs:
              fields:
                - id: username
                  type: string
                  label: Username
              required:
                - username
            injectors: "{{ __kerberos_injectors }}"

    - name: Export credential type template to temp file
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/filetree_create/templates/controller_credential_types.j2"
        dest: /tmp/test_kerberos_credential_type_export.yaml
        mode: '0644'

    - name: Validate exported YAML parses
      ansible.builtin.set_fact:
        __exported: "{{ lookup('file', '/tmp/test_kerberos_credential_type_export.yaml') | from_yaml }}"

    - name: Import exported file via include_vars (same path as filetree_read)
      ansible.builtin.include_vars:
        file: /tmp/test_kerberos_credential_type_export.yaml

    - name: Assert injectors template preserved after import
      ansible.builtin.assert:
        that:
          - controller_credential_types | length == 1
          - controller_credential_types[0].name == 'Kerberos'
          - controller_credential_types[0].injectors.file.template is search('default_realm')
          - controller_credential_types[0].injectors.env.KRB5_CONFIG is search('tower.filename')
          - controller_credential_types[0].injectors.extra_vars.ansible_user is search('username')

    - name: Validate Kerberos fixture YAML parses via include_vars
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/configs/fcf/controller_credential_types_kerberos.yaml"

    - name: Assert Kerberos fixture injectors load correctly
      ansible.builtin.assert:
        that:
          - controller_credential_types | length == 1
          - controller_credential_types[0].injectors.file.template is search('libdefaults')
          - controller_credential_types[0].injectors.file.template is search('kdc')
...
