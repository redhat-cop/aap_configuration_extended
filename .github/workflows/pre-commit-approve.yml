---
# Trusted workflow: approval gate + Ansible collections cache population.
# Does not checkout or execute PR head code (no pwn-request risk).
# Secrets (CRC_PUBLISH_KEY) are only used here; pre-commit-tests restores the cache.
name: pre-commit approval

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: ["Release - Automated"]
    types: [completed]
  push:
    branches: [devel]
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  check-changes:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    outputs:
      github_modified: ${{ steps.filter.outputs.github }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Base branch only; paths-filter uses the GitHub API for PR file lists.
          sparse-checkout: .github

      - name: Check for modified .github files
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            github:
              - '.github/**'

  release-auto-approve:
    if: >-
      github.event_name == 'pull_request_target' &&
      (startsWith(github.event.pull_request.head.ref, 'release/') ||
       startsWith(github.event.pull_request.title, '[RELEASE]'))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Release pull request approved automatically
        run: echo "Release pull request approved automatically."
      - name: Auto-apply approval label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const label = 'ci-approved';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const labels = context.payload.pull_request.labels.map(l => l.name);
            if (!labels.includes(label)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [label] });
            }

  auto-approve:
    needs: check-changes
    if: >-
      github.event_name == 'pull_request_target' &&
      contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) &&
      needs.check-changes.outputs.github_modified == 'false' &&
      !startsWith(github.event.pull_request.head.ref, 'release/') &&
      !startsWith(github.event.pull_request.title, '[RELEASE]')
    runs-on: ubuntu-latest
    # issues.addLabels requires write (tightened to read in #306 and broke labeling).
    permissions:
      pull-requests: write
    steps:
      - name: Trusted collaborator PR approved automatically
        run: echo "Trusted collaborator PR approved automatically."
      - name: Auto-apply approval label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const label = 'ci-approved';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const labels = context.payload.pull_request.labels.map(l => l.name);
            if (!labels.includes(label)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [label] });
            }

  manual-approval:
    needs: check-changes
    if: >-
      github.event_name == 'pull_request_target' &&
      !startsWith(github.event.pull_request.head.ref, 'release/') &&
      !startsWith(github.event.pull_request.title, '[RELEASE]') &&
      (!contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) ||
       needs.check-changes.outputs.github_modified == 'true')
    runs-on: ubuntu-latest
    environment: requires-approval
    # issues.addLabels requires write (tightened to read in #306 and broke labeling).
    permissions:
      pull-requests: write
    steps:
      - name: Approval granted
        run: echo "Approval granted."

      - name: Apply approval label after manual review
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const label = 'ci-approved';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const labels = context.payload.pull_request.labels.map(l => l.name);
            if (!labels.includes(label)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [label] });
            }

  # PRs opened by the release workflow use GITHUB_TOKEN and may not trigger
  # pull_request_target; label the release PR and re-run tests after release completes.
  bootstrap-release-pr-ci:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      actions: write
    steps:
      - name: Bootstrap CI for release merge pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: prs } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              base: 'devel',
              per_page: 100,
            });
            const releasePr = prs.find(
              (pr) =>
                pr.head.ref.startsWith('release/') &&
                pr.title.startsWith('[RELEASE]'),
            );
            if (!releasePr) {
              core.info('No open release pull request to bootstrap');
              return;
            }

            const label = 'ci-approved';
            const labels = releasePr.labels.map((l) => l.name);
            if (!labels.includes(label)) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: releasePr.number,
                labels: [label],
              });
            }

            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'pre-commit-tests.yml',
              head_sha: releasePr.head.sha,
              event: 'pull_request',
              per_page: 5,
            });
            const testRun = runs.workflow_runs.find(
              (run) => run.conclusion === 'cancelled' || run.conclusion === 'failure',
            );
            if (testRun) {
              await github.rest.actions.reRunWorkflow({
                owner,
                repo,
                run_id: testRun.id,
              });
              core.notice(
                `Re-ran pre-commit tests workflow ${testRun.id} for PR #${releasePr.number}`,
                { title: 'Release PR CI bootstrap' },
              );
            } else {
              core.info(
                `No failed or cancelled pre-commit test run found for PR #${releasePr.number}`,
              );
            }

  # Install certified collections with secrets and save the cache for untrusted test runs.
  # Always uses the base/devel tree — never the PR head.
  populate-collections-cache:
    runs-on: ubuntu-latest
    env:
      ANSIBLE_GALAXY_SERVER_LIST: certified,galaxy
      ANSIBLE_GALAXY_SERVER_CERTIFIED_URL: https://console.redhat.com/api/automation-hub/content/published/
      ANSIBLE_GALAXY_SERVER_CERTIFIED_AUTH_URL: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
      ANSIBLE_GALAXY_SERVER_CERTIFIED_TOKEN: ${{ secrets.CRC_PUBLISH_KEY }}
      ANSIBLE_GALAXY_SERVER_GALAXY_URL: https://galaxy.ansible.com/api/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Restore Ansible collections cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: collections_cache
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('.github/collections/requirements.yml', 'galaxy.yml', '.pre-commit-config.yaml') }}
          restore-keys: |
            ansible-collections-

      - name: Install Ansible Galaxy collections
        id: install_collections
        if: >
          steps.collections_cache.outputs.cache-hit != 'true' ||
          github.event_name == 'schedule'
        run: |
          pip install ansible
          ansible-galaxy collection install -r .github/collections/requirements.yml

      - name: Save Ansible collections cache
        if: >
          steps.install_collections.outcome == 'success' &&
          steps.collections_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('.github/collections/requirements.yml', 'galaxy.yml', '.pre-commit-config.yaml') }}
