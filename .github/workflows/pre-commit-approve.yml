---
# Trusted workflow: manual approval gate for external PRs.
# Does not checkout or execute PR code (no pwn-request risk).
name: pre-commit approval

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  approve_run:
    environment: requires-approval
    runs-on: ubuntu-latest
    steps:
      - name: Approval granted
        run: echo "Approval granted."

      - name: Mark PR as approved for CI
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const label = 'ci-approved';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const labels = context.payload.pull_request.labels.map((item) => item.name);
            if (!labels.includes(label)) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number,
                labels: [label],
              });
            }
