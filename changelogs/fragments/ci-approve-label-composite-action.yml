---
bugfixes:
  - fix pre-commit approval workflow label step by using github-script instead of
    gh CLI, which requires a local git repository
  - reset ci-approved labels on each pull request lifecycle event and bind approval
    to the pull request head SHA so reused branches cannot reuse stale approvals
  - log CI approval routing and environment protection context in workflow summaries
  - fix pre-commit-tests cache key expression that made the workflow file invalid
  - verify ci-approved SHA labels via github-script because workflow expressions
    do not support substring
