---
bugfixes:
  - filetree_create - Export manually added hosts when an inventory has inventory sources
    (fixes redhat-cop/aap_configuration_extended#260).
  - filetree_create - Include every host in manually defined groups, including hosts
    created by inventory sources.
  - filetree_create - Use ``is mapping`` / ``is string`` checks before ``from_yaml`` in
    export templates so ansible-core 2.23+ does not emit deprecation warnings for dict
    API values (for example schedule ``extra_data``).
  - filetree_create - Fix undefined ``current_organization_dir`` in
    ``controller_organizations.yml`` (use ``current_organization``; static task name
    to avoid template warnings when ``flatten_output`` skips the non-flatten block).
minor_changes:
  - format_yaml - Normalize YAML for ansible-lint (``yaml[truthy]``, ``yaml[document-end]``,
    ``yaml[indentation]``, trailing whitespace) and apply it to all files generated by
    filetree_create.
  - filetree_create - Widen ``to_nice_yaml`` output and use non-greedy Jinja wrapping so
    exported variables with ``{{ }}`` are not split across lines.
