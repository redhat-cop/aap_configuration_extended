DOCUMENTATION:
  name: filetree_var_name
  version_added: "4.10.0"
  short_description: Build a canonical variable name for an exported filetree field
  description:
    - Normalize object type, name, and field into a safe Ansible variable fragment.
    - Used by C(filetree_create) templates when exporting environment-specific values as variable references.
  positional: object_type, name, field, prefix, scope, collisions
  options:
    object_type:
      description: Controller or gateway object type (for example C(controller_projects)).
      type: str
      required: true
    name:
      description: Object name whose field is being exported.
      type: str
      required: true
    field:
      description: Field name within the object (for example C(scm_url)).
      type: str
      required: true
    prefix:
      description: Variable name prefix for vaulted or environment-specific values.
      type: str
      default: vaulted
    scope:
      description:
        - Scope that makes the object name unique (for example its organization or inventory name).
        - Only used when the object is listed in O(collisions).
      type: str
      version_added: "4.14.0"
    collisions:
      description:
        - Output of C(filetree_var_collisions) for all exported objects of this type.
        - Objects listed here get a short hash of O(scope) and O(name) after the name, so objects whose
          names would otherwise map to the same variable get their own. Other names are unchanged.
      type: list
      elements: str
      version_added: "4.14.0"

EXAMPLES: |
  - name: Build a variable name for a project SCM URL
    debug:
      msg: "{{ 'controller_projects' | infra.aap_configuration_extended.filetree_var_name('My Project', 'scm_url', prefix='vaulted') }}"
    # => vaulted_controller_projects_my_project_scm_url

  - name: Build distinct names for credentials whose names would collide
    debug:
      msg: "{{ 'controller_credentials' | infra.aap_configuration_extended.filetree_var_name(item.name, 'password', 'vaulted',
                item.summary_fields.organization.name, __collisions) }}"
    loop: "{{ credentials }}"
    vars:
      __collisions: "{{ credentials | infra.aap_configuration_extended.filetree_var_collisions('name', 'summary_fields.organization.name') }}"
    # 'RH Insights' and 'RH-Insights' => vaulted_controller_credentials_rh_insights_<6 hex>_password (one each)

RETURN:
  _value:
    description: Canonical Ansible variable name for the exported field.
    type: str
...
