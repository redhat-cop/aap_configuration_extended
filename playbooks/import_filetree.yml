---
# Import a filetree export into AAP (PRO), resolving secrets/env placeholders.
#
# Required:
#   - Exported tree path via dir_orgs_vars (filetree_create output_path)
#   - PRO connection vars (aap_hostname / credentials or token)
#   - Filled env_variables file: -e @/path/to/env_variables.yml
#
# Uses controller_configuration_filetree_read_layout=create so filetree_read
# searches the export tree (ORG/*.d and root YAML) without rearranging into
# hierarchical orgs/env paths. orgs and env are unused in this mode.
#
# Example:
#   ansible-playbook playbooks/import_filetree.yml \
#     -e aap_hostname=aap-pro.example.com \
#     -e aap_username=admin -e aap_password=secret \
#     -e aap_validate_certs=false \
#     -e dir_orgs_vars=/tmp/jt_export \
#     -e @/tmp/jt_export/env_variables.yml
#
- name: Import filetree configuration into AAP
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aap_username: "{{ vault_aap_username | default(lookup('env', 'CONTROLLER_USERNAME')) }}"
    aap_password: "{{ vault_aap_password | default(lookup('env', 'CONTROLLER_PASSWORD')) }}"
    aap_hostname: "{{ vault_aap_hostname | default(lookup('env', 'CONTROLLER_HOST')) }}"
    aap_validate_certs: "{{ vault_aap_validate_certs | default(lookup('env', 'CONTROLLER_VERIFY_SSL') | default(true)) }}"
    dir_orgs_vars: "{{ lookup('env', 'FILETREE_OUTPUT') | default('/tmp/filetree_output', true) }}"
    controller_configuration_filetree_read_layout: create

  pre_tasks:
    - name: "Setup authentication (block)"
      when: aap_oauthtoken is not defined
      no_log: "{{ controller_configuration_filetree_read_secure_logging | default(false) }}"
      tags:
        - always
      block:
        - name: "Get the Authentication Token for the future requests"
          ansible.builtin.uri:
            url: "https://{{ aap_hostname }}/api/gateway/v1/tokens/"
            user: "{{ aap_username }}"
            password: "{{ aap_password }}"
            method: POST
            force_basic_auth: true
            validate_certs: "{{ aap_validate_certs }}"
            status_code: 201
          register: authtoken_res

        - name: "Set the oauth token to be used since now"
          ansible.builtin.set_fact:
            aap_oauthtoken: "{{ authtoken_res.json.token }}"
            aap_oauthtoken_url: "{{ authtoken_res.json.url }}"

  roles:
    - infra.aap_configuration_extended.filetree_read
    - infra.aap_configuration.dispatch

  post_tasks:
    - name: "Delete the Authentication Token used"
      ansible.builtin.uri:
        url: "https://{{ aap_hostname }}{{ aap_oauthtoken_url }}"
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        method: DELETE
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
        status_code: 204
      when: aap_oauthtoken_url is defined
      no_log: "{{ controller_configuration_filetree_read_secure_logging | default(false) }}"
      tags:
        - always
...
