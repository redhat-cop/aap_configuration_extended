---
- name: "Upgrade_config | Common Item - Validate input path and copy {{ current_common_item.object }}"
  vars:
    __common_src: "{{ aap24_configs_dir }}/{{ input_filename_prefix | default('') }}{{ current_common_item.object }}.yaml"
  block:
    - name: "Upgrade_config | Common Item - Stat source file"
      ansible.builtin.stat:
        path: "{{ __common_src }}"
      register: __upgrade_common_src_stat

    - name: "Upgrade_config | Common Item - Assert source file exists"
      ansible.builtin.assert:
        that:
          - __upgrade_common_src_stat.stat.exists
        fail_msg: "Missing required AAP <= 2.4 input file: {{ __common_src }}"

    - name: "Upgrade_config | Common Item - Copy the original file to the destination one: {{ current_common_item.object }}"
      ansible.builtin.copy:
        src: "{{ __common_src }}"
        dest: "{{ aap25_configs_dir }}/aap_{{ current_common_item.object }}.yaml"
        mode: "0644"

- name: "Upgrade_config | Common Item - Assert variable prefix is known for {{ current_common_item.object }}"
  ansible.builtin.assert:
    that:
      - __prefix in ['aap', 'gateway', 'controller']
    fail_msg: >-
      current_common_item.object '{{ current_common_item.object }}' is not listed in
      roles/upgrade_config/defaults/main.yaml variable_prefix; lineinfile rewrite cannot proceed.
  vars:
    __prefix: "{{ 'aap' if current_common_item.object in variable_prefix.aap else
                  'gateway' if current_common_item.object in variable_prefix.gateway else
                  'controller' if current_common_item.object in variable_prefix.controller else
                  'UNKNOWN'
               }}"
  when: current_common_item.object not in ['notifications']

- name: "Replace the variable name: {{ current_common_item.object }}"
  ansible.builtin.lineinfile:
    path: "{{ aap25_configs_dir }}/aap_{{ current_common_item.object }}.yaml"
    regex: '^controller_(.*):\s*$'
    line: '{{ __prefix }}_\g<1>:'
    backrefs: true
  vars:
    __prefix: "{{ 'aap' if current_common_item.object in variable_prefix.aap else
                  'gateway' if current_common_item.object in variable_prefix.gateway else
                  'controller' if current_common_item.object in variable_prefix.controller else
                  'UNKNOWN'
               }}"
  when: current_common_item.object not in ['notifications']

- name: "Replace the variable name: {{ current_common_item.object }}"
  ansible.builtin.lineinfile:
    path: "{{ aap25_configs_dir }}/aap_{{ current_common_item.object }}.yaml"
    regex: '^controller_notifications:\s*$'
    line: 'notification_templates:'
    backrefs: true
  when: current_common_item.object in ['notifications']
...
