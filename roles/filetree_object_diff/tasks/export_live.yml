---
- name: "Ensure live export directory exists"
  ansible.builtin.file:
    path: "{{ filetree_object_diff_live_path }}"
    state: directory
    mode: "0755"

- name: "Export current API objects to live filetree"
  ansible.builtin.import_role:
    name: infra.aap_configuration_extended.filetree_create
  vars:
    output_path: "{{ filetree_object_diff_live_path }}"
    input_tag: "{{ filetree_object_diff_create_tags }}"
    organization_filter: "{{ orgs | default(omit) }}"
    # Flattened live export reduces filewalk cost during compare_files.
    flatten_output: true
    omit_id: true
    controller_configuration_filetree_create_secure_logging: "{{ controller_configuration_filetree_create_secure_logging }}"
...
