---
- name: "Initialize effective filetree_object_diff task list"
  ansible.builtin.set_fact:
    __filetree_object_diff_effective_tasks: []

- name: "Collect tasks allowed for the current API user"
  ansible.builtin.set_fact:
    __filetree_object_diff_effective_tasks: "{{ __filetree_object_diff_effective_tasks + [item] }}"
  loop: "{{ controller_configuration_filetree_object_diff_tasks }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - not (item.superuser_only | default(false) | bool) or (__filetree_object_diff_is_superuser | default(false) | bool)

- name: "Apply effective task list to derived role variables"
  ansible.builtin.set_fact:
    controller_configuration_filetree_object_diff_tasks: "{{ __filetree_object_diff_effective_tasks }}"
    filetree_object_diff_dispatch_roles: "{{ __filetree_object_diff_effective_tasks }}"
    filetree_object_diff_root_keys_filter: "{{ __filetree_object_diff_effective_tasks | map(attribute='var') | list }}"
    # Deduplicate create tags (credential_input_sources reuses controller_credentials).
    # controller_roles needs teams/users role export side-effects from filetree_create.
    filetree_object_diff_create_tags: >-
      {{
        (
          (__filetree_object_diff_effective_tasks | map(attribute='create_tag') | list)
          + (
            ['roles', 'gateway_users', 'gateway_teams', 'controller_teams']
            if (
              __filetree_object_diff_effective_tasks
              | selectattr('create_tag', 'equalto', 'controller_roles')
              | list
              | length
            ) > 0
            else []
          )
        )
        | unique
        | list
      }}

...
