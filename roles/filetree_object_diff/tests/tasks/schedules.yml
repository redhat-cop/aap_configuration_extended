---
- name: Compute schedule filetree delta
  ansible.builtin.set_fact:
    __diff: "{{ query('infra.aap_configuration_extended.controller_filetree_diff',
      live_list=__live_list, cac_list=__cac_list,
      object_type='schedule', with_present=false, set_absent=true) | flatten }}"
  vars:
    __live_list:
      - name: Shared Schedule
        unified_job_template: Shared Job Template
      - name: Orphan Schedule
        unified_job_template: Orphan Job Template
    __cac_list:
      - name: Shared Schedule
        unified_job_template: Shared Job Template
      - name: New CaC Schedule
        unified_job_template: Shared Job Template

- name: Validate schedule delta
  ansible.builtin.include_tasks: assert_delta.yml
  vars:
    __object_label: schedules
    __id_field: name
    __cac_only_name: New CaC Schedule
    __orphan_name: Orphan Schedule
    __shared_name: Shared Schedule
...
