---
- name: Compute workflow job template filetree delta
  ansible.builtin.set_fact:
    __diff: "{{ query('infra.aap_configuration_extended.controller_filetree_diff',
      live_list=__live_list, cac_list=__cac_list,
      object_type='workflow_job_template', with_present=false, set_absent=true) | flatten }}"
  vars:
    __live_list:
      - name: Shared Workflow
        organization: Default
      - name: Orphan Workflow
        organization: Default
    __cac_list:
      - name: Shared Workflow
        organization: Default
      - name: New CaC Workflow
        organization: Default

- name: Validate workflow delta
  ansible.builtin.include_tasks: assert_delta.yml
  vars:
    __object_label: workflow_job_templates
    __id_field: name
    __cac_only_name: New CaC Workflow
    __orphan_name: Orphan Workflow
    __shared_name: Shared Workflow
...
