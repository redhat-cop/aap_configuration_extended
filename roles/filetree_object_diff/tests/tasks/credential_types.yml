---
- name: Compute credential type filetree delta
  ansible.builtin.set_fact:
    __diff: "{{ query('infra.aap_configuration_extended.controller_filetree_diff',
      live_list=__live_list, cac_list=__cac_list,
      object_type='credential_type', with_present=false, set_absent=true) | flatten }}"
  vars:
    __live_list:
      - name: Shared Credential Type
      - name: Orphan Credential Type
    __cac_list:
      - name: Shared Credential Type
      - name: New CaC Credential Type

- name: Validate credential type delta
  ansible.builtin.include_tasks: assert_delta.yml
  vars:
    __object_label: credential_types
    __id_field: name
    __cac_only_name: New CaC Credential Type
    __orphan_name: Orphan Credential Type
    __shared_name: Shared Credential Type
...
