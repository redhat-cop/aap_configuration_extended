---
- name: Compute application filetree delta
  ansible.builtin.set_fact:
    __diff: "{{ query('infra.aap_configuration_extended.controller_filetree_diff',
      live_list=__live_list, cac_list=__cac_list,
      object_type='application', with_present=false, set_absent=true) | flatten }}"
  vars:
    __live_list:
      - name: Shared Application
        organization: Default
      - name: Orphan Application
        organization: Default
    __cac_list:
      - name: Shared Application
        organization: Default
      - name: New CaC Application
        organization: Default

- name: Validate application delta
  ansible.builtin.include_tasks: assert_delta.yml
  vars:
    __object_label: applications
    __id_field: name
    __cac_only_name: New CaC Application
    __orphan_name: Orphan Application
    __shared_name: Shared Application
...
