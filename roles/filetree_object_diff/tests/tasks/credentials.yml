---
- name: Compute credential delta ignoring secret inputs
  ansible.builtin.set_fact:
    __diff: "{{ query('infra.aap_configuration_extended.controller_filetree_diff',
      live_list=__live_list, cac_list=__cac_list,
      object_type='credential', with_present=false, set_absent=true) | flatten }}"
  vars:
    __live_list:
      - name: Shared Credential
        organization: Default
        credential_type: Machine
        inputs:
          password: live-secret
      - name: Orphan Credential
        organization: Default
        credential_type: Machine
    __cac_list:
      - name: Shared Credential
        organization: Default
        credential_type: Machine
        inputs:
          password: "{{ vault_password }}"
      - name: New CaC Credential
        organization: Default
        credential_type: Machine

- name: Validate credential delta
  ansible.builtin.include_tasks: assert_delta.yml
  vars:
    __object_label: credentials
    __id_field: name
    __cac_only_name: New CaC Credential
    __orphan_name: Orphan Credential
    __shared_name: Shared Credential
...
