---
- name: Compute host filetree delta
  ansible.builtin.set_fact:
    __diff: "{{ query('infra.aap_configuration_extended.controller_filetree_diff',
      live_list=__live_list, cac_list=__cac_list,
      object_type='host', with_present=false, set_absent=true) | flatten }}"
  vars:
    __live_list:
      - name: shared-host
        inventory: Shared Inventory
      - name: orphan-host
        inventory: Shared Inventory
    __cac_list:
      - name: shared-host
        inventory: Shared Inventory
      - name: new-cac-host
        inventory: Shared Inventory

- name: Validate host delta
  ansible.builtin.include_tasks: assert_delta.yml
  vars:
    __object_label: hosts
    __id_field: name
    __cac_only_name: new-cac-host
    __orphan_name: orphan-host
    __shared_name: shared-host
...
