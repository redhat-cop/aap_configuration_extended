---
- name: Compute project filetree delta
  ansible.builtin.set_fact:
    __diff: "{{ query('infra.aap_configuration_extended.controller_filetree_diff',
      live_list=__live_list, cac_list=__cac_list,
      object_type='project', with_present=false, set_absent=true) | flatten }}"
  vars:
    __live_list:
      - name: Shared Project
        organization: Default
      - name: Orphan Project
        organization: Default
    __cac_list:
      - name: Shared Project
        organization: Default
      - name: New CaC Project
        organization: Default

- name: Validate project delta
  ansible.builtin.include_tasks: assert_delta.yml
  vars:
    __object_label: projects
    __id_field: name
    __cac_only_name: New CaC Project
    __orphan_name: Orphan Project
    __shared_name: Shared Project
...
