---
- name: Compute notification template filetree delta
  ansible.builtin.set_fact:
    __diff: "{{ query('infra.aap_configuration_extended.controller_filetree_diff',
      live_list=__live_list, cac_list=__cac_list,
      object_type='notification_template', with_present=false, set_absent=true) | flatten }}"
  vars:
    __live_list:
      - name: Shared Notification
        organization: Default
      - name: Orphan Notification
        organization: Default
    __cac_list:
      - name: Shared Notification
        organization: Default
      - name: New CaC Notification
        organization: Default

- name: Validate notification template delta
  ansible.builtin.include_tasks: assert_delta.yml
  vars:
    __object_label: notification_templates
    __id_field: name
    __cac_only_name: New CaC Notification
    __orphan_name: Orphan Notification
    __shared_name: Shared Notification
...
