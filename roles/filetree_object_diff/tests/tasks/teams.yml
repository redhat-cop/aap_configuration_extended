---
- name: Compute team filetree delta
  ansible.builtin.set_fact:
    __diff: "{{ query('infra.aap_configuration_extended.controller_filetree_diff',
      live_list=__live_list, cac_list=__cac_list,
      object_type='team', with_present=false, set_absent=true) | flatten }}"
  vars:
    __live_list:
      - name: Shared Team
        organization: Default
      - name: Orphan Team
        organization: Default
    __cac_list:
      - name: Shared Team
        organization: Default
      - name: New CaC Team
        organization: Default

- name: Validate team delta
  ansible.builtin.include_tasks: assert_delta.yml
  vars:
    __object_label: teams
    __id_field: name
    __cac_only_name: New CaC Team
    __orphan_name: Orphan Team
    __shared_name: Shared Team
...
