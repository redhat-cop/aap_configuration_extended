---
- name: Compute inventory filetree delta
  ansible.builtin.set_fact:
    __diff: "{{ query('infra.aap_configuration_extended.controller_filetree_diff',
      live_list=__live_list, cac_list=__cac_list,
      object_type='inventory', with_present=false, set_absent=true) | flatten }}"
  vars:
    __live_list:
      - name: Shared Inventory
        organization: Default
        description: Live description
      - name: Orphan Inventory
        organization: Default
    __cac_list:
      - name: Shared Inventory
        organization: Default
        description: Live description
      - name: New CaC Inventory
        organization: Default
        description: Only in CaC

- name: Validate inventory delta
  ansible.builtin.include_tasks: assert_delta.yml
  vars:
    __object_label: inventories
    __id_field: name
    __cac_only_name: New CaC Inventory
    __orphan_name: Orphan Inventory
    __shared_name: Shared Inventory
...
