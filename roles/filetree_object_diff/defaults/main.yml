---
# defaults file for filetree_object_diff

filetree_object_diff_live_path: "/tmp/filetree_object_diff_live"
filetree_object_diff_diff_path: "/tmp/filetree_object_diff_delta"
filetree_object_diff_cleanup_live_path: true
filetree_object_diff_cleanup_diff_path: false
query_controller_api_max_objects: 10000

# Variables used to render Jinja in repository CaC files before file comparison.
filetree_object_diff_template_vars: "{{ {'orgs': orgs, 'env': env} if orgs is defined and env is defined else {} }}"

# YAML root keys to compare (derived from the active task list).
filetree_object_diff_root_keys_filter: "{{ controller_configuration_filetree_object_diff_tasks | map(attribute='var') | list }}"

# Repository CaC directories used for on-disk comparison (path_key -> filetree_read path var).
filetree_object_diff_cac_path_map:
  - {path_key: filetree_aap_organizations, var: aap_organizations}
  - {path_key: filetree_controller_credential_types, var: controller_credential_types}
  - {path_key: filetree_controller_instance_groups, var: controller_instance_groups}
  - {path_key: filetree_controller_execution_environments, var: controller_execution_environments}
  - {path_key: filetree_controller_projects, var: controller_projects}
  - {path_key: filetree_controller_inventories, var: controller_inventories}
  - {path_key: filetree_controller_credentials, var: controller_credentials}
  - {path_key: filetree_aap_teams, var: aap_teams}
  - {path_key: filetree_aap_user_accounts, var: aap_user_accounts}
  - {path_key: filetree_aap_applications, var: aap_applications}
  - {path_key: filetree_controller_notifications, var: controller_notifications}
  - {path_key: filetree_controller_hosts, var: controller_hosts}
  - {path_key: filetree_controller_groups, var: controller_groups}
  - {path_key: filetree_controller_inventory_sources, var: controller_inventory_sources}
  - {path_key: filetree_controller_templates, var: controller_templates}
  - {path_key: filetree_controller_workflow_job_templates, var: controller_workflows}
  - {path_key: filetree_controller_schedules, var: controller_schedules}
  - {path_key: filetree_controller_roles, var: controller_roles}

# When false (default), return only the delta.
# When true, return the full CaC list as present plus live-only objects as absent.
include_present_state: false

# Filter external-auth users from the live export when comparing users.
drop_user_external_accounts: false

# Additional keys ignored during content comparison (merged with lookup defaults).
filetree_object_diff_ignore_keys: []

# Automation Controller / Gateway object lists (populated by filetree_read before this role).
controller_settings: []
aap_organizations: []
controller_labels: []
aap_user_accounts: []
aap_teams: []
controller_credential_types: []
controller_credentials: []
controller_credential_input_sources: []
controller_notifications: []
controller_projects: []
controller_execution_environments: []
aap_applications: []
controller_inventories: []
controller_inventory_sources: []
controller_instance_groups: []
controller_hosts: []
controller_groups: []
controller_templates: []
controller_workflows: []
controller_schedules: []
controller_roles: []

controller_configuration_filetree_object_diff_tasks:
  - {name: controller_schedules, var: controller_schedules, tags: controller_schedules, create_tag: controller_schedules, object_type: schedule}
  - {name: controller_workflow_job_templates, var: controller_workflows, tags: controller_workflow_job_templates, create_tag: controller_workflow_job_templates, object_type: workflow_job_template}
  - {name: controller_job_templates, var: controller_templates, tags: controller_job_templates, create_tag: controller_job_templates, object_type: job_template}
  - {name: controller_roles, var: controller_roles, tags: controller_roles, create_tag: controller_roles, object_type: role, superuser_only: true}
  - {name: controller_teams, var: aap_teams, tags: controller_teams, create_tag: gateway_teams, object_type: team}
  - {name: controller_user_accounts, var: aap_user_accounts, tags: controller_users, create_tag: gateway_users, object_type: user}
  - {name: controller_host_groups, var: controller_groups, tags: controller_host_groups, create_tag: controller_groups, object_type: group}
  - {name: controller_hosts, var: controller_hosts, tags: controller_hosts, create_tag: controller_hosts, object_type: host}
  - {name: controller_applications, var: aap_applications, tags: controller_applications, create_tag: gateway_applications, object_type: application}
  - {name: controller_execution_environments, var: controller_execution_environments, tags: controller_execution_environments, create_tag: controller_execution_environments, object_type: execution_environment}
  - {name: controller_inventory_sources, var: controller_inventory_sources, tags: controller_inventory_sources, create_tag: controller_inventory_sources, object_type: inventory_source}
  - {name: controller_inventories, var: controller_inventories, tags: controller_inventories, create_tag: controller_inventories, object_type: inventory}
  - {name: controller_projects, var: controller_projects, tags: controller_projects, create_tag: controller_projects, object_type: project}
  - {name: controller_notification_templates, var: controller_notifications, tags: controller_notification_templates, create_tag: controller_notification_templates, object_type: notification_template}
  - {name: controller_credentials, var: controller_credentials, tags: controller_credentials, create_tag: controller_credentials, object_type: credential}
  - {name: controller_credential_types, var: controller_credential_types, tags: controller_credential_types, create_tag: controller_credential_types, object_type: credential_type}
  - {name: controller_organizations, var: aap_organizations, tags: controller_organizations, create_tag: controller_organizations, object_type: organization, superuser_only: true}
  - {name: controller_instance_groups, var: controller_instance_groups, tags: controller_instance_groups, create_tag: controller_instance_groups, object_type: instance_group, superuser_only: true}

controller_configuration_filetree_object_diff_secure_logging: "{{ controller_configuration_secure_logging | default(true) }}"
controller_configuration_filetree_create_secure_logging: "{{ controller_configuration_secure_logging | default(false) }}"
controller_configuration_filetree_read_secure_logging: "{{ controller_configuration_secure_logging | default(true) }}"

controller_api_version: "v2"
gateway_api_version: "v1"

# Tags passed to filetree_create (derived from tasks unless overridden).
filetree_object_diff_create_tags: "{{ controller_configuration_filetree_object_diff_tasks | map(attribute='create_tag') | list }}"
...
