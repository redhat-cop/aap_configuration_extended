---
# defaults file for filetree_object_diff

filetree_object_diff_live_path: "/tmp/filetree_object_diff_live"
filetree_object_diff_diff_path: "/tmp/filetree_object_diff_delta"
filetree_object_diff_cleanup_live_path: true
filetree_object_diff_cleanup_diff_path: false
# Match filetree_create output layouts: false = org/type directories, true = flat per-type files.
filetree_object_diff_flatten_output: false
filetree_object_diff_omit_id: true
query_controller_api_max_objects: 10000

# Variables used to render Jinja in repository CaC files before file comparison.
filetree_object_diff_template_vars: "{{ {'orgs': orgs, 'env': env} if orgs is defined and env is defined else {} }}"

# YAML root keys to compare (derived from the active task list).
filetree_object_diff_root_keys_filter: "{{ controller_configuration_filetree_object_diff_tasks | map(attribute='var') | list }}"

# Repository CaC directories used for on-disk comparison (path_key -> filetree_read path var).
# Covers every object type supported by filetree_create + filetree_read + dispatch.
filetree_object_diff_cac_path_map:
  # Gateway
  - {path_key: filetree_gateway_authenticators, var: gateway_authenticators}
  - {path_key: filetree_gateway_authenticator_maps, var: gateway_authenticator_maps}
  - {path_key: filetree_gateway_settings, var: gateway_settings}
  - {path_key: filetree_aap_organizations, var: aap_organizations}
  - {path_key: filetree_aap_applications, var: aap_applications}
  - {path_key: filetree_gateway_http_ports, var: gateway_http_ports}
  - {path_key: filetree_gateway_service_clusters, var: gateway_service_clusters}
  - {path_key: filetree_gateway_service_keys, var: gateway_service_keys}
  - {path_key: filetree_gateway_service_nodes, var: gateway_service_nodes}
  - {path_key: filetree_gateway_services, var: gateway_services}
  - {path_key: filetree_aap_teams, var: aap_teams}
  - {path_key: filetree_aap_user_accounts, var: aap_user_accounts}
  - {path_key: filetree_gateway_role_definitions, var: gateway_role_definitions}
  - {path_key: filetree_gateway_role_team_assignments, var: gateway_role_team_assignments}
  - {path_key: filetree_gateway_role_user_assignments, var: gateway_role_user_assignments}
  - {path_key: filetree_gateway_routes, var: gateway_routes}
  # Controller
  - {path_key: filetree_controller_settings, var: controller_settings}
  - {path_key: filetree_controller_labels, var: controller_labels}
  - {path_key: filetree_controller_credential_types, var: controller_credential_types}
  - {path_key: filetree_controller_credential_input_sources, var: controller_credential_input_sources}
  - {path_key: filetree_controller_credentials, var: controller_credentials}
  - {path_key: filetree_controller_notifications, var: controller_notifications}
  - {path_key: filetree_controller_projects, var: controller_projects}
  - {path_key: filetree_controller_execution_environments, var: controller_execution_environments}
  - {path_key: filetree_controller_inventories, var: controller_inventories}
  - {path_key: filetree_controller_inventory_sources, var: controller_inventory_sources}
  - {path_key: filetree_controller_instance_groups, var: controller_instance_groups}
  - {path_key: filetree_controller_instances, var: controller_instances}
  - {path_key: filetree_controller_hosts, var: controller_hosts}
  - {path_key: filetree_controller_groups, var: controller_groups}
  - {path_key: filetree_controller_templates, var: controller_templates}
  - {path_key: filetree_controller_workflow_job_templates, var: controller_workflows}
  - {path_key: filetree_controller_schedules, var: controller_schedules}
  - {path_key: filetree_controller_roles, var: controller_roles}
  # EDA
  - {path_key: filetree_eda_credential_types, var: eda_credential_types}
  - {path_key: filetree_eda_credentials, var: eda_credentials}
  - {path_key: filetree_eda_decision_environments, var: eda_decision_environments}
  - {path_key: filetree_eda_event_streams, var: eda_event_streams}
  - {path_key: filetree_eda_projects, var: eda_projects}
  - {path_key: filetree_eda_rulebook_activations, var: eda_rulebook_activations}
  # Hub
  - {path_key: filetree_hub_namespaces, var: hub_namespaces}
  - {path_key: filetree_hub_collections, var: hub_collections}
  - {path_key: filetree_hub_collection_remotes, var: hub_collection_remotes}
  - {path_key: filetree_hub_collection_repositories, var: hub_collection_repositories}
  - {path_key: filetree_hub_ee_registries, var: hub_ee_registries}
  - {path_key: filetree_hub_ee_repositories, var: hub_ee_repositories}
  - {path_key: filetree_hub_ee_images, var: hub_ee_images}

# When false (default), return only the delta.
# When true, return the full CaC list as present plus live-only objects as absent.
include_present_state: false

# Filter external-auth users from the live export when comparing users.
drop_user_external_accounts: false

# Additional keys ignored during content comparison (merged with lookup defaults).
filetree_object_diff_ignore_keys: []

# Object lists (populated by filetree_read before this role / after reading the delta).
gateway_authenticators: []
gateway_authenticator_maps: []
gateway_settings: {}
gateway_http_ports: []
gateway_service_clusters: []
gateway_service_keys: []
gateway_service_nodes: []
gateway_services: []
gateway_role_definitions: []
gateway_role_team_assignments: []
gateway_role_user_assignments: []
gateway_routes: []
controller_settings: []
aap_organizations: []
controller_labels: []
aap_user_accounts: []
aap_teams: []
controller_credential_types: []
controller_credentials: []
controller_credential_input_sources: []
controller_notifications: []
controller_projects: []
controller_execution_environments: []
aap_applications: []
controller_inventories: []
controller_inventory_sources: []
controller_instance_groups: []
controller_instances: []
controller_hosts: []
controller_groups: []
controller_templates: []
controller_workflows: []
controller_schedules: []
controller_roles: []
eda_credential_types: []
eda_credentials: []
eda_decision_environments: []
eda_event_streams: []
eda_projects: []
eda_rulebook_activations: []
hub_namespaces: []
hub_collections: []
hub_collection_remotes: []
hub_collection_repositories: []
hub_ee_registries: []
hub_ee_repositories: []
hub_ee_images: []

# Full intersection of filetree_create export tags and infra.aap_configuration.dispatch
# (excludes runtime-only dispatch roles: launches, syncs, bulk hosts, publish).
# Order mirrors filetree_read / dispatch dependency order where practical.
controller_configuration_filetree_object_diff_tasks:
  # Gateway
  - {name: gateway_authenticators, var: gateway_authenticators, tags: gateway_authenticators, create_tag: gateway_authenticators, object_type: authenticator, dispatch_role: gateway_authenticators, dispatch_tag: gateway_authenticators, superuser_only: true}
  - {name: gateway_authenticator_maps, var: gateway_authenticator_maps, tags: gateway_authenticator_maps, create_tag: gateway_authenticator_maps, object_type: authenticator_map, dispatch_role: gateway_authenticator_maps, dispatch_tag: gateway_authenticator_maps, superuser_only: true}
  - {name: gateway_settings, var: gateway_settings, tags: gateway_settings, create_tag: gateway_settings, object_type: settings, dispatch_role: gateway_settings, dispatch_tag: gateway_settings, superuser_only: true}
  # create_tag controller_organizations exports aap_organizations (filetree_read CaC key).
  - {name: controller_organizations, var: aap_organizations, tags: controller_organizations, create_tag: controller_organizations, object_type: organization, dispatch_role: gateway_organizations, dispatch_tag: gateway_organizations, superuser_only: true}
  - {name: controller_applications, var: aap_applications, tags: controller_applications, create_tag: gateway_applications, object_type: application, dispatch_role: gateway_applications, dispatch_tag: gateway_applications}
  - {name: gateway_http_ports, var: gateway_http_ports, tags: gateway_http_ports, create_tag: gateway_http_ports, object_type: http_port, dispatch_role: gateway_http_ports, dispatch_tag: gateway_http_ports, superuser_only: true}
  - {name: gateway_service_clusters, var: gateway_service_clusters, tags: gateway_service_clusters, create_tag: gateway_service_clusters, object_type: service_cluster, dispatch_role: gateway_service_clusters, dispatch_tag: gateway_service_clusters, superuser_only: true}
  - {name: gateway_service_keys, var: gateway_service_keys, tags: gateway_service_keys, create_tag: gateway_service_keys, object_type: service_key, dispatch_role: gateway_service_keys, dispatch_tag: gateway_service_keys, superuser_only: true}
  - {name: gateway_service_nodes, var: gateway_service_nodes, tags: gateway_service_nodes, create_tag: gateway_service_nodes, object_type: service_node, dispatch_role: gateway_service_nodes, dispatch_tag: gateway_service_nodes, superuser_only: true}
  - {name: gateway_services, var: gateway_services, tags: gateway_services, create_tag: gateway_services, object_type: gateway_service, dispatch_role: gateway_services, dispatch_tag: gateway_services, superuser_only: true}
  - {name: controller_teams, var: aap_teams, tags: controller_teams, create_tag: gateway_teams, object_type: team, dispatch_role: gateway_teams, dispatch_tag: gateway_teams}
  - {name: controller_user_accounts, var: aap_user_accounts, tags: controller_users, create_tag: gateway_users, object_type: user, dispatch_role: gateway_users, dispatch_tag: gateway_users}
  - {name: gateway_role_definitions, var: gateway_role_definitions, tags: gateway_role_definitions, create_tag: gateway_role_definitions, object_type: role_definition, dispatch_role: gateway_role_definitions, dispatch_tag: gateway_role_definitions, superuser_only: true}
  - {name: gateway_role_team_assignments, var: gateway_role_team_assignments, tags: gateway_role_team_assignments, create_tag: gateway_role_team_assignments, object_type: role_team_assignment, dispatch_role: gateway_role_team_assignments, dispatch_tag: gateway_role_team_assignments}
  - {name: gateway_role_user_assignments, var: gateway_role_user_assignments, tags: gateway_role_user_assignments, create_tag: gateway_role_user_assignments, object_type: role_user_assignment, dispatch_role: gateway_role_user_assignments, dispatch_tag: gateway_role_user_assignments}
  - {name: gateway_routes, var: gateway_routes, tags: gateway_routes, create_tag: gateway_routes, object_type: route, dispatch_role: gateway_routes, dispatch_tag: gateway_routes, superuser_only: true}
  # Controller
  - {name: controller_settings, var: controller_settings, tags: controller_settings, create_tag: controller_settings, object_type: settings, dispatch_role: controller_settings, dispatch_tag: controller_settings, superuser_only: true}
  - {name: controller_labels, var: controller_labels, tags: controller_labels, create_tag: controller_labels, object_type: label, dispatch_role: controller_labels, dispatch_tag: controller_labels}
  - {name: controller_credential_types, var: controller_credential_types, tags: controller_credential_types, create_tag: controller_credential_types, object_type: credential_type, dispatch_role: controller_credential_types, dispatch_tag: controller_credential_types}
  - {name: controller_credentials, var: controller_credentials, tags: controller_credentials, create_tag: controller_credentials, object_type: credential, dispatch_role: controller_credentials, dispatch_tag: controller_credentials}
  # Exported as a side-effect of controller_credentials in filetree_create.
  - {name: controller_credential_input_sources, var: controller_credential_input_sources, tags: controller_credential_input_sources, create_tag: controller_credentials, object_type: credential_input_source, dispatch_role: controller_credential_input_sources, dispatch_tag: controller_credential_input_sources}
  - {name: controller_notification_templates, var: controller_notifications, tags: controller_notification_templates, create_tag: controller_notification_templates, object_type: notification_template, dispatch_role: controller_notification_templates, dispatch_tag: controller_notification_templates}
  - {name: controller_projects, var: controller_projects, tags: controller_projects, create_tag: controller_projects, object_type: project, dispatch_role: controller_projects, dispatch_tag: controller_projects}
  - {name: controller_execution_environments, var: controller_execution_environments, tags: controller_execution_environments, create_tag: controller_execution_environments, object_type: execution_environment, dispatch_role: controller_execution_environments, dispatch_tag: controller_execution_environments}
  - {name: controller_inventories, var: controller_inventories, tags: controller_inventories, create_tag: controller_inventories, object_type: inventory, dispatch_role: controller_inventories, dispatch_tag: controller_inventories}
  - {name: controller_inventory_sources, var: controller_inventory_sources, tags: controller_inventory_sources, create_tag: controller_inventory_sources, object_type: inventory_source, dispatch_role: controller_inventory_sources, dispatch_tag: controller_inventory_sources}
  - {name: controller_instance_groups, var: controller_instance_groups, tags: controller_instance_groups, create_tag: controller_instance_groups, object_type: instance_group, dispatch_role: controller_instance_groups, dispatch_tag: controller_instance_groups, superuser_only: true}
  - {name: controller_instances, var: controller_instances, tags: controller_instances, create_tag: controller_instances, object_type: instance, dispatch_role: controller_instances, dispatch_tag: controller_instances, superuser_only: true}
  - {name: controller_hosts, var: controller_hosts, tags: controller_hosts, create_tag: controller_hosts, object_type: host, dispatch_role: controller_hosts, dispatch_tag: controller_hosts}
  - {name: controller_host_groups, var: controller_groups, tags: controller_host_groups, create_tag: controller_groups, object_type: group, dispatch_role: controller_host_groups, dispatch_tag: controller_host_groups}
  - {name: controller_job_templates, var: controller_templates, tags: controller_job_templates, create_tag: controller_job_templates, object_type: job_template, dispatch_role: controller_job_templates, dispatch_tag: controller_job_templates}
  - {name: controller_workflow_job_templates, var: controller_workflows, tags: controller_workflow_job_templates, create_tag: controller_workflow_job_templates, object_type: workflow_job_template, dispatch_role: controller_workflow_job_templates, dispatch_tag: controller_workflow_job_templates}
  - {name: controller_schedules, var: controller_schedules, tags: controller_schedules, create_tag: controller_schedules, object_type: schedule, dispatch_role: controller_schedules, dispatch_tag: controller_schedules}
  - {name: controller_roles, var: controller_roles, tags: controller_roles, create_tag: controller_roles, object_type: role, dispatch_role: controller_roles, dispatch_tag: controller_roles, superuser_only: true}
  # EDA
  - {name: eda_credential_types, var: eda_credential_types, tags: eda_credential_types, create_tag: eda_credential_types, object_type: eda_credential_type, dispatch_role: eda_credential_types, dispatch_tag: eda_credential_types}
  - {name: eda_credentials, var: eda_credentials, tags: eda_credentials, create_tag: eda_credentials, object_type: eda_credential, dispatch_role: eda_credentials, dispatch_tag: eda_credentials}
  - {name: eda_decision_environments, var: eda_decision_environments, tags: eda_decision_environments, create_tag: eda_decision_environments, object_type: eda_decision_environment, dispatch_role: eda_decision_environments, dispatch_tag: eda_decision_environments}
  - {name: eda_event_streams, var: eda_event_streams, tags: eda_event_streams, create_tag: eda_event_streams, object_type: eda_event_stream, dispatch_role: eda_event_streams, dispatch_tag: eda_event_streams}
  - {name: eda_projects, var: eda_projects, tags: eda_projects, create_tag: eda_projects, object_type: eda_project, dispatch_role: eda_projects, dispatch_tag: eda_projects}
  - {name: eda_rulebook_activations, var: eda_rulebook_activations, tags: eda_rulebook_activations, create_tag: eda_rulebook_activations, object_type: eda_rulebook_activation, dispatch_role: eda_rulebook_activations, dispatch_tag: eda_rulebook_activations}
  # Hub
  - {name: hub_namespaces, var: hub_namespaces, tags: hub_namespaces, create_tag: hub_namespaces, object_type: hub_namespace, dispatch_role: hub_namespace, dispatch_tag: hub_namespaces}
  - {name: hub_collections, var: hub_collections, tags: hub_collections, create_tag: hub_collections, object_type: hub_collection, dispatch_role: hub_collection, dispatch_tag: hub_collections}
  - {name: hub_collection_remotes, var: hub_collection_remotes, tags: hub_collection_remotes, create_tag: hub_collection_remotes, object_type: hub_collection_remote, dispatch_role: hub_collection_remote, dispatch_tag: hub_collection_remotes}
  - {name: hub_collection_repositories, var: hub_collection_repositories, tags: hub_collection_repositories, create_tag: hub_collection_repositories, object_type: hub_collection_repository, dispatch_role: hub_collection_repository, dispatch_tag: hub_collection_repositories}
  - {name: hub_ee_registries, var: hub_ee_registries, tags: hub_ee_registries, create_tag: hub_ee_registries, object_type: hub_ee_registry, dispatch_role: hub_ee_registry, dispatch_tag: hub_ee_registries}
  - {name: hub_ee_repositories, var: hub_ee_repositories, tags: hub_ee_repositories, create_tag: hub_ee_repositories, object_type: hub_ee_repository, dispatch_role: hub_ee_repository, dispatch_tag: hub_ee_repositories}
  - {name: hub_ee_images, var: hub_ee_images, tags: hub_ee_images, create_tag: hub_ee_images, object_type: hub_ee_image, dispatch_role: hub_ee_image, dispatch_tag: hub_ee_images}

# Dispatch mapping derived from the active task list (Gateway / Hub / Controller / EDA).
filetree_object_diff_dispatch_roles: "{{ controller_configuration_filetree_object_diff_tasks }}"

controller_configuration_filetree_object_diff_secure_logging: "{{ controller_configuration_secure_logging | default(true) }}"
controller_configuration_filetree_create_secure_logging: "{{ controller_configuration_secure_logging | default(false) }}"
controller_configuration_filetree_read_secure_logging: "{{ controller_configuration_secure_logging | default(true) }}"

controller_api_version: "v2"
gateway_api_version: "v1"

# Tags passed to filetree_create (derived from tasks unless overridden).
filetree_object_diff_create_tags: "{{ controller_configuration_filetree_object_diff_tasks | map(attribute='create_tag') | unique | list }}"
...
