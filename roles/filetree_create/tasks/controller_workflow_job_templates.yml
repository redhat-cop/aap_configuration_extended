---
- name: "Get current Workflow Job Templates from the API"
  ansible.builtin.set_fact:
    workflow_job_templates_lookvar: "{{ query('ansible.platform.gateway_api', 'api/controller/v2/workflow_job_templates/',
                                              query_params=(query_params | combine({'organization': organization_id} if organization_id is defined else {},
                                                {'name': workflow_job_template_name} if workflow_job_template_name is defined else {},
                                                {'id': workflow_job_template_id} if workflow_job_template_id is defined and workflow_job_template_name is not defined else {},
                                                {'labels__search': label_filter} if label_filter is defined else {})),
                                              host=aap_hostname, oauth_token=__filetree_create_oauth_token, verify_ssl=aap_validate_certs,
                                              return_all=true, max_objects=query_controller_api_max_objects)
                                     }}"
  vars:
    query_params:
      order_by: 'organization,id'
  no_log: "{{ controller_configuration_filetree_create_secure_logging }}"

- name: "Assert the requested Workflow Job Template was found"
  when: (workflow_job_template_name is defined) or (workflow_job_template_id is defined)
  ansible.builtin.assert:
    that:
      - (workflow_job_templates_lookvar | length) > 0
    fail_msg: >-
      No Workflow Job Template matched
      {{ 'name=' ~ workflow_job_template_name if workflow_job_template_name is defined else 'id=' ~ workflow_job_template_id }}.
      Names with spaces must be passed as JSON extra vars, e.g.
      -e '{"workflow_job_template_name":"My Workflow"}' (plain -e key=value truncates at the first space).

- name: "Export related block for Workflow Job Template"
  when:
    - (workflow_job_template_name is defined) or (workflow_job_template_id is defined)
    - export_related_objects is defined and (export_related_objects | bool)
    - (workflow_job_templates_lookvar | length) > 0
  vars:
    __related_wfjt: "{{ workflow_job_templates_lookvar | first }}"
  block:
    - name: "Collect related object names from the Workflow Job Template"
      ansible.builtin.set_fact:
        related_organization_name: "{{ __related_wfjt.summary_fields.organization.name | default(omit, true) }}"
        related_wfjt_inventory_name: "{{ __related_wfjt.summary_fields.inventory.name | default(omit, true) }}"
      no_log: "{{ controller_configuration_filetree_create_secure_logging }}"

    - name: "Discover nested workflows and job templates reachable from this Workflow Job Template"
      ansible.builtin.include_tasks: "controller_workflow_related_discover.yml"
      vars:
        __wfjt_discover_seed_name: "{{ __related_wfjt.name }}"
      no_log: "{{ controller_configuration_filetree_create_secure_logging }}"

    - name: "Query labels related to the Workflow Job Template"
      ansible.builtin.set_fact:
        related_label_names: "{{ query('ansible.platform.gateway_api', __related_wfjt.related.labels,
                                       host=aap_hostname, oauth_token=__filetree_create_oauth_token, verify_ssl=aap_validate_certs,
                                       return_all=true, max_objects=query_controller_api_max_objects)
                                | map(attribute='name') | list }}"
      no_log: "{{ controller_configuration_filetree_create_secure_logging }}"

    - name: "Query notification templates related to the Workflow Job Template"
      ansible.builtin.set_fact:
        related_notification_template_names: "{{ (query('ansible.platform.gateway_api', __related_wfjt.related.notification_templates_error,
                  host=aap_hostname, oauth_token=__filetree_create_oauth_token, verify_ssl=aap_validate_certs,
                  return_all=true, max_objects=query_controller_api_max_objects)
            + query('ansible.platform.gateway_api', __related_wfjt.related.notification_templates_started,
                    host=aap_hostname, oauth_token=__filetree_create_oauth_token, verify_ssl=aap_validate_certs,
                    return_all=true, max_objects=query_controller_api_max_objects)
            + query('ansible.platform.gateway_api', __related_wfjt.related.notification_templates_success,
                    host=aap_hostname, oauth_token=__filetree_create_oauth_token, verify_ssl=aap_validate_certs,
                    return_all=true, max_objects=query_controller_api_max_objects)
            + query('ansible.platform.gateway_api', __related_wfjt.related.notification_templates_approvals,
                    host=aap_hostname, oauth_token=__filetree_create_oauth_token, verify_ssl=aap_validate_certs,
                    return_all=true, max_objects=query_controller_api_max_objects)) | map(attribute='name') | list | unique }}"
      no_log: "{{ controller_configuration_filetree_create_secure_logging }}"

    - name: "Export organization related to workflow job template"
      when: related_organization_name is defined
      ansible.builtin.include_tasks: "controller_organizations.yml"
      vars:
        organization_name: "{{ related_organization_name }}"
      no_log: "{{ controller_configuration_filetree_create_secure_logging }}"

    - name: "Build inventory name list for the workflow graph"
      ansible.builtin.set_fact:
        __related_graph_inventory_names: "{{ ((__discovered_inventory_names | default([])) + ([related_wfjt_inventory_name] if related_wfjt_inventory_name is defined else [])) | unique | list }}"
      no_log: "{{ controller_configuration_filetree_create_secure_logging }}"

    - name: "Export inventories referenced by the workflow graph"
      when: (__related_graph_inventory_names | length) > 0
      ansible.builtin.include_tasks: "controller_inventories.yml"
      vars:
        inventory_name: "{{ related_graph_inventory_name_item }}"
      loop: "{{ __related_graph_inventory_names }}"
      loop_control:
        loop_var: related_graph_inventory_name_item
      no_log: "{{ controller_configuration_filetree_create_secure_logging }}"

    - name: "Export nested Workflow Job Templates discovered in the graph"
      when: ((__discovered_workflow_job_template_names | default([])) | difference([__related_wfjt.name]) | length) > 0
      ansible.builtin.include_tasks: "controller_workflow_job_template_by_name.yml"
      vars:
        # Do not reuse workflow_job_template_name: it is often an extra var (-e) and cannot be overridden.
        nested_workflow_job_template_name: "{{ related_graph_wfjt_name_item }}"
      loop: "{{ (__discovered_workflow_job_template_names | default([])) | difference([__related_wfjt.name]) }}"
      loop_control:
        loop_var: related_graph_wfjt_name_item
      no_log: "{{ controller_configuration_filetree_create_secure_logging }}"

    - name: "Export Job Templates (with related objects) discovered in the workflow graph"
      when: (__discovered_job_template_names | default([]) | length) > 0
      ansible.builtin.include_tasks: "controller_job_templates.yml"
      vars:
        job_template_name: "{{ related_graph_jt_name_item }}"
        export_related_objects: true
      loop: "{{ __discovered_job_template_names }}"
      loop_control:
        loop_var: related_graph_jt_name_item
      no_log: "{{ controller_configuration_filetree_create_secure_logging }}"

    - name: "Export labels related to workflow job template"
      when: (related_label_names | default([]) | length) > 0
      ansible.builtin.include_tasks: "controller_labels.yml"
      vars:
        label_names: "{{ related_label_names }}"
      no_log: "{{ controller_configuration_filetree_create_secure_logging }}"

    - name: "Export notification templates related to workflow job template"
      when: (related_notification_template_names | default([]) | length) > 0
      ansible.builtin.include_tasks: "controller_notification_templates.yml"
      vars:
        notification_template_names: "{{ related_notification_template_names }}"
      no_log: "{{ controller_configuration_filetree_create_secure_logging }}"

    - name: "Export schedules related to workflow job template"
      ansible.builtin.include_tasks: "controller_schedules.yml"
      vars:
        schedules_related_url: "{{ __related_wfjt.related.schedules }}"
      no_log: "{{ controller_configuration_filetree_create_secure_logging }}"

- name: "Block for to generate flatten output"
  when:
    - flatten_output is defined
    - flatten_output | bool
  vars:
    __dest: "{{ output_path }}/controller_workflow_job_templates.yaml"
  block:
    - name: "Add current workflow_job_templates to the controller_workflow_job_templates flat file"
      ansible.builtin.blockinfile:
        create: true
        mode: "0644"
        insertafter: EOF
        path: "{{ __dest }}"
        marker: ""
        block: "{{ lookup('template', 'templates/controller_workflow_job_templates.j2') }}"
      vars:
        workflow_job_template_organization: "{{ current_workflow_job_templates_asset_value.summary_fields.organization.name | default(organization) }}"
        workflow_job_template_id: "{{ current_workflow_job_templates_asset_value.id }}"
        workflow_job_template_name: "{{ current_workflow_job_templates_asset_value.name | regex_replace('/', '_') }}"
        query_labels: "{{ query('ansible.platform.gateway_api', current_workflow_job_templates_asset_value.related.labels,
                         host=aap_hostname, oauth_token=__filetree_create_oauth_token, verify_ssl=aap_validate_certs,
                         return_all=true, max_objects=query_controller_api_max_objects) }}"
        query_notification_error: "{{ query('ansible.platform.gateway_api', current_workflow_job_templates_asset_value.related.notification_templates_error,
                         host=aap_hostname, oauth_token=__filetree_create_oauth_token, verify_ssl=aap_validate_certs,
                         return_all=true, max_objects=query_controller_api_max_objects) }}"
        query_notification_started: "{{ query('ansible.platform.gateway_api', current_workflow_job_templates_asset_value.related.notification_templates_started,
                         host=aap_hostname, oauth_token=__filetree_create_oauth_token, verify_ssl=aap_validate_certs,
                         return_all=true, max_objects=query_controller_api_max_objects) }}"
        query_notification_success: "{{ query('ansible.platform.gateway_api', current_workflow_job_templates_asset_value.related.notification_templates_success,
                         host=aap_hostname, oauth_token=__filetree_create_oauth_token, verify_ssl=aap_validate_certs,
                         return_all=true, max_objects=query_controller_api_max_objects) }}"
        query_notification_approvals: "{{ query('ansible.platform.gateway_api', current_workflow_job_templates_asset_value.related.notification_templates_approvals,
                         host=aap_hostname, oauth_token=__filetree_create_oauth_token, verify_ssl=aap_validate_certs,
                         return_all=true, max_objects=query_controller_api_max_objects) }}"
        last_workflow_job_template: "{{ current_workflow_job_template_index == ((workflow_job_templates_lookvar | length) - 1) }}"
      loop: "{{ workflow_job_templates_lookvar }}"
      loop_control:
        index_var: current_workflow_job_template_index
        loop_var: current_workflow_job_templates_asset_value
        label: "{{ __dest }}"
      no_log: "{{ controller_configuration_filetree_create_secure_logging }}"

    - name: "Remove all the blank lines introduced by the last task"
      ansible.builtin.lineinfile:
        path: "{{ __dest }}"
        line: ''
        state: absent

- name: "Block for to generate the filetree_create normal output"
  when: flatten_output is not defined or not (flatten_output | bool)
  block:
    - name: "Create the <ORGANIZATION_NAME>/{{ __task_name_append }}"
      ansible.builtin.file:
        path: "{{ __path }}"
        state: directory
        mode: '0755'
      vars:
        __task_name_append: "{{ filetree_create_controller_workflow_job_templates }} output directory for workflow job templates in {{ output_path }}"
        __path: "{{ output_path }}/{{ needed_path | regex_replace('/', '_') }}/{{ filetree_create_controller_workflow_job_templates }}/"
      loop: "{{ (workflow_job_templates_lookvar | map(attribute='summary_fields') | selectattr('organization', 'defined') |
                map(attribute='organization') | map(attribute='name') | list | flatten | unique) +
                ([organization] if ((workflow_job_templates_lookvar | map(attribute='summary_fields') |
                selectattr('organization', 'undefined') | list | flatten) | length > 0) else [])
            }}"
      loop_control:
        loop_var: needed_path
        label: "{{ __path }}"

    - name: "Add current workflow job templates to the <ORGANIZATION_NAME>/{{ __task_name_append }}"
      ansible.builtin.template:
        src: "templates/controller_workflow_job_templates.j2"
        dest: "{{ __dest }}"
        mode: '0644'
      vars:
        __task_name_append: "{{ filetree_create_controller_workflow_job_templates }} output file in {{ output_path }}"
        workflow_job_template_organization: "{{ current_workflow_job_templates_asset_value.summary_fields.organization.name | default(organization) }}"
        workflow_job_template_id: "{{ current_workflow_job_templates_asset_value.id }}"
        workflow_job_template_name: "{{ current_workflow_job_templates_asset_value.name | regex_replace('/', '_') }}"
        __dest: "{{ output_path }}/{{ workflow_job_template_organization | regex_replace('/', '_') }}/{{ filetree_create_controller_workflow_job_templates }}/{{ (workflow_job_template_id ~ '_') if not (omit_id | default(false) | bool) else '' }}{{ workflow_job_template_name | regex_replace('/', '_') }}.yaml"
        query_labels: "{{ query('ansible.platform.gateway_api', current_workflow_job_templates_asset_value.related.labels,
                         host=aap_hostname, oauth_token=__filetree_create_oauth_token, verify_ssl=aap_validate_certs,
                         return_all=true, max_objects=query_controller_api_max_objects) }}"
        query_notification_error: "{{ query('ansible.platform.gateway_api', current_workflow_job_templates_asset_value.related.notification_templates_error,
                         host=aap_hostname, oauth_token=__filetree_create_oauth_token, verify_ssl=aap_validate_certs,
                         return_all=true, max_objects=query_controller_api_max_objects) }}"
        query_notification_started: "{{ query('ansible.platform.gateway_api', current_workflow_job_templates_asset_value.related.notification_templates_started,
                         host=aap_hostname, oauth_token=__filetree_create_oauth_token, verify_ssl=aap_validate_certs,
                         return_all=true, max_objects=query_controller_api_max_objects) }}"
        query_notification_success: "{{ query('ansible.platform.gateway_api', current_workflow_job_templates_asset_value.related.notification_templates_success,
                         host=aap_hostname, oauth_token=__filetree_create_oauth_token, verify_ssl=aap_validate_certs,
                         return_all=true, max_objects=query_controller_api_max_objects) }}"
        query_notification_approvals: "{{ query('ansible.platform.gateway_api', current_workflow_job_templates_asset_value.related.notification_templates_approvals,
                         host=aap_hostname, oauth_token=__filetree_create_oauth_token, verify_ssl=aap_validate_certs,
                         return_all=true, max_objects=query_controller_api_max_objects) }}"
      loop: "{{ workflow_job_templates_lookvar }}"
      loop_control:
        loop_var: current_workflow_job_templates_asset_value
        label: "{{ __dest }}"
      no_log: "{{ controller_configuration_filetree_create_secure_logging }}"
...
