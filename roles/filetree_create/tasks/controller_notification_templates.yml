---
- name: "Get current Notification Templates from the API"
  ansible.builtin.set_fact:
    notification_templates_lookvar: "{{ query('ansible.platform.gateway_api', 'api/controller/v2/notification_templates/',
                                              query_params=(query_params | combine({'organization': organization_id} if organization_id is defined and notification_template_name is not defined and notification_template_names is not defined and notification_template_id is not defined and notification_template_ids is not defined else {},
                                                {'name': notification_template_name} if notification_template_name is defined else {},
                                                {'name__in': (notification_template_names | join(','))} if notification_template_names is defined and (notification_template_names | length) > 0 and notification_template_name is not defined else {},
                                                {'id': notification_template_id} if notification_template_id is defined and notification_template_name is not defined and notification_template_names is not defined else {},
                                                {'id__in': (notification_template_ids | join(','))} if notification_template_ids is defined and (notification_template_ids | length) > 0 and notification_template_id is not defined and notification_template_name is not defined and notification_template_names is not defined else {})),
                                              host=aap_hostname, oauth_token=aap_oauthtoken, verify_ssl=aap_validate_certs,
                                              return_all=true, max_objects=query_controller_api_max_objects)
                                     }}"
  vars:
    query_params:
      order_by: 'organization,id'
  no_log: "{{ controller_configuration_filetree_create_secure_logging }}"

- name: "Block for to generate flatten output"
  when:
    - flatten_output is defined
    - flatten_output | bool
  vars:
    __dest: "{{ output_path }}/controller_notification_templates.yaml"
  block:
    - name: "Add current notification_templates to the controller_notification_templates flat file"
      ansible.builtin.blockinfile:
        create: true
        mode: "0644"
        insertafter: EOF
        path: "{{ __dest }}"
        marker: ""
        block: "{{ lookup('template', 'templates/controller_notification_templates.j2') }}"
      vars:
        last_notification_template: "{{ current_notification_template_index == ((notification_templates_lookvar | length) - 1) }}"
      loop: "{{ notification_templates_lookvar }}"
      loop_control:
        index_var: current_notification_template_index
        loop_var: current_notification_templates_asset_value
        label: "{{ __dest }}"

    - name: "Remove all the blank lines introduced by the last task"
      ansible.builtin.lineinfile:
        path: "{{ __dest }}"
        line: ''
        state: absent

- name: "Block for to generate the filetree_create normal output"
  when: flatten_output is not defined or not (flatten_output | bool)
  block:
    - name: "Create the <ORGANIZATION_NAME>/{{ __task_name_append }}"
      ansible.builtin.file:
        path: "{{ __path }}"
        state: directory
        mode: '0755'
      vars:
        __task_name_append: "{{ filetree_create_controller_notifications }} output directory for notification templates in {{ output_path }}"
        __path: "{{ output_path }}/{{ needed_path | regex_replace('/', '_') }}/{{ filetree_create_controller_notifications }}"
      loop: "{{ (notification_templates_lookvar | map(attribute='summary_fields') | selectattr('organization', 'defined') |
                map(attribute='organization') | map(attribute='name') | list | flatten | unique) +
                ([organization] if ((notification_templates_lookvar | map(attribute='summary_fields') |
                selectattr('organization', 'undefined') | list | flatten) | length > 0) else [])
            }}"
      loop_control:
        loop_var: needed_path
        label: "{{ __path }}"

    - name: "Add current notification templates to the <ORGANIZATION_NAME>/controller_notification_templates.yaml output file in {{ output_path }}"
      ansible.builtin.template:
        src: "templates/controller_notification_templates.j2"
        dest: "{{ __dest }}"
        mode: '0644'
      vars:
        __dest: "{{ output_path }}/{{ (current_notification_templates_asset_value.summary_fields.organization.name | default(organization, true)) | regex_replace('/', '_') }}/{{ filetree_create_controller_notifications }}/{{ current_notification_templates_asset_value.name | regex_replace('/', '_') }}.yaml"
      loop: "{{ notification_templates_lookvar }}"
      loop_control:
        loop_var: current_notification_templates_asset_value
        label: "{{ __dest }}"
...
