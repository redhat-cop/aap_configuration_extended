---
- name: "Get current Credential Types from the API when AAP"
  ansible.builtin.set_fact:
    credential_types_lookvar: "{{ query('ansible.platform.gateway_api', 'api/controller/v2/credential_types/',
                                        query_params=(query_params | combine({'name': credential_type_name} if credential_type_name is defined else {},
                                          {'name__in': (credential_type_names | join(','))} if credential_type_names is defined and (credential_type_names | length) > 0 and credential_type_name is not defined else {},
                                          {'id': credential_type_id} if credential_type_id is defined and credential_type_name is not defined and credential_type_names is not defined else {},
                                          {'id__in': (credential_type_ids | join(','))} if credential_type_ids is defined and (credential_type_ids | length) > 0 and credential_type_id is not defined and credential_type_name is not defined and credential_type_names is not defined else {})),
                                        host=aap_hostname, oauth_token=__filetree_create_oauth_token, verify_ssl=aap_validate_certs,
                                        return_all=true, max_objects=query_controller_api_max_objects)
                               }}"
  vars:
    query_params:
      managed: false
  no_log: "{{ controller_configuration_filetree_create_secure_logging }}"

- name: "Run only if there's any credential type to write down"
  block:
    - name: "Create the output directory for credential types: {{ output_path }}"
      ansible.builtin.file:
        path: "{{ output_path }}"
        state: directory
        mode: '0755'

    - name: "Add current credential types to the credential_types.yaml output file in {{ output_path }}"
      ansible.builtin.template:
        src: "templates/controller_credential_types.j2"
        dest: "{{ output_path }}/controller_credential_types.yaml"
        mode: '0644'
      vars:
        current_credential_types_asset_value: "{{ credential_types_lookvar }}"
...
