---
- name: "Get current Execution Environments from the API"
  ansible.builtin.set_fact:
    execution_environments_lookvar: "{{ query('ansible.platform.gateway_api', 'api/controller/v2/execution_environments/',
                                              query_params=(query_params | combine({'organization': organization_id} if organization_id is defined and execution_environment_name is not defined and execution_environment_names is not defined and execution_environment_id is not defined and execution_environment_ids is not defined else {},
                                                {'name': execution_environment_name} if execution_environment_name is defined else {},
                                                {'name__in': (execution_environment_names | join(','))} if execution_environment_names is defined and (execution_environment_names | length) > 0 and execution_environment_name is not defined else {},
                                                {'id': execution_environment_id} if execution_environment_id is defined and execution_environment_name is not defined and execution_environment_names is not defined else {},
                                                {'id__in': (execution_environment_ids | join(','))} if execution_environment_ids is defined and (execution_environment_ids | length) > 0 and execution_environment_id is not defined and execution_environment_name is not defined and execution_environment_names is not defined else {})),
                                              host=aap_hostname, oauth_token=aap_oauthtoken, verify_ssl=aap_validate_certs,
                                              return_all=true, max_objects=query_controller_api_max_objects)
                                     }}"
  vars:
    query_params:
      order_by: 'organization,id'
  no_log: "{{ controller_configuration_filetree_create_secure_logging }}"

- name: "Create the output directory for execution environments: {{ output_path }}"
  ansible.builtin.file:
    path: "{{ output_path }}"
    state: directory
    mode: '0755'

- name: "Add current execution environments to the execution_environments.yaml output file in {{ output_path }}"
  ansible.builtin.template:
    src: "templates/controller_execution_environments.j2"
    dest: "{{ output_path }}/controller_execution_environments.yaml"
    mode: '0644'
  vars:
    current_execution_environments_asset_value: "{{ execution_environments_lookvar }}"
...
