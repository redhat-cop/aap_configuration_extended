---
- name: "Block to get the organization_filter IDs to filter all the queries"
  when:
    - organization_filter is defined
    - organization_filter | length > 0
  block:
    - name: "Resolve Gateway organization ID for organization_filter"
      ansible.builtin.set_fact:
        gateway_organization_id: "{{ __gateway_org.id }}"
        gateway_organization_ansible_id: "{{ __gateway_org.ansible_id | default(none) }}"
      vars:
        __gateway_org: "{{ lookup('ansible.platform.gateway_api', 'api/gateway/v1/organizations',
                                    query_params={'name': organization_filter},
                                    host=aap_hostname, oauth_token=__filetree_create_oauth_token,
                                    verify_ssl=aap_validate_certs)
                          }}"
      no_log: "{{ controller_configuration_filetree_create_secure_logging }}"

    - name: "Resolve Controller organization ID for organization_filter"
      ansible.builtin.set_fact:
        controller_organization_id: "{{ __controller_org.id }}"
        controller_organization_ansible_id: "{{ __controller_org.ansible_id | default(none) }}"
      vars:
        __controller_org: "{{ lookup('ansible.platform.gateway_api', 'api/controller/v2/organizations',
                                    query_params={'name': organization_filter},
                                    host=aap_hostname, oauth_token=__filetree_create_oauth_token,
                                    verify_ssl=aap_validate_certs)
                            }}"
      no_log: "{{ controller_configuration_filetree_create_secure_logging }}"

    - name: "Keep legacy organization_id as Gateway ID for Gateway-only callers"
      ansible.builtin.set_fact:
        organization_id: "{{ gateway_organization_id }}"

    - name: "Show the organization_filter Gateway and Controller IDs"
      ansible.builtin.debug:
        msg: >-
          The organization {{ organization_filter }} has Gateway ID {{ gateway_organization_id }}
          and Controller ID {{ controller_organization_id }}
          {{ '(ansible_id match: ' ~ gateway_organization_ansible_id ~ ')'
             if (gateway_organization_ansible_id not in [none, '']
                 and gateway_organization_ansible_id == controller_organization_ansible_id)
             else '' }}

- name: "Map legacy organization_id when split IDs are unset"
  when:
    - organization_id is defined
    - gateway_organization_id is not defined
  ansible.builtin.set_fact:
    gateway_organization_id: "{{ organization_id }}"
    controller_organization_id: "{{ organization_id }}"

- name: "Block to check if the PAH instance is available"
  block:
    - name: "Set the fact to control whether the PAH is available or not"
      ansible.builtin.set_fact:
        __pah_available: "{{ 'galaxy' in lookup('ansible.platform.gateway_api', '/api/',
                       host=aap_hostname, oauth_token=__filetree_create_oauth_token,
                       verify_ssl=aap_validate_certs).apis }}"

