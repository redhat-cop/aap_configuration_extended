---
- name: Filetree read test
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aap_configuration_projects_async_retries: 120
    aap_configuration_projects_async_delay: 2
    aap_username: "{{ vault_aap_username | default(lookup('env', 'CONTROLLER_USERNAME')) }}"
    aap_password: "{{ vault_aap_password | default(lookup('env', 'CONTROLLER_PASSWORD')) }}"
    aap_hostname: "{{ vault_aap_hostname | default(lookup('env', 'CONTROLLER_HOST')) }}"
    aap_validate_certs: "{{ vault_controller_validate_certs | default(lookup('env', 'CONTROLLER_VERIFY_SSL')) }}"
  pre_tasks:
    - name: "Setup authentication (block)"
      no_log: "{{ controller_configuration_filetree_read_secure_logging | default('false') }}"
      when: not (ansible_facts.get('aap_token') or aap_token is defined)
      tags:
        - always
      block:
        - name: "Create a new token using platform username/password"
          ansible.platform.token:
            description: 'Token for Automated Management'
            scope: "write"
            state: present
            aap_hostname: "{{ aap_hostname }}"
            aap_username: "{{ aap_username }}"
            aap_password: "{{ aap_password }}"
            aap_validate_certs: "{{ aap_validate_certs }}"

        - name: "Expose OAuth token string for CaC dispatch roles"
          ansible.builtin.set_fact:
            aap_token: "{{ ansible_facts['aap_token'].token }}"
  roles:
    - infra.aap_configuration_extended.filetree_read
    - infra.aap_configuration.dispatch

  post_tasks:
    - name: "Delete the Authentication Token used"
      ansible.platform.token:
        existing_token: "{{ ansible_facts['aap_token'] }}"
        state: absent
        aap_hostname: "{{ aap_hostname }}"
        aap_username: "{{ aap_username }}"
        aap_password: "{{ aap_password }}"
        aap_validate_certs: "{{ aap_validate_certs }}"
      when:
        - ansible_facts.get('aap_token') is defined
        - ansible_facts.aap_token is mapping
...
