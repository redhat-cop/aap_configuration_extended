---
- name: "Get list of files inside {{ filetree_controller_instances }}"
  ansible.builtin.find:
    paths: "{{ filetree_controller_instances }}"
    file_type: file
    patterns: "{{ filetree_controller_include | default(omit) }}"
    excludes: "{{ filetree_controller_exclude | default(omit) }}"
    use_regex: "{{ filetree_controller_regex | default(false) }}"
    contains: "controller_instances:"
    read_whole_file: true
    recurse: true
  register: __list_files_controller_instances

- name: "Read Instances definitions"
  ansible.builtin.include_vars:
    file: "{{ __read_instances_definitions_item.path }}"
  loop: "{{ __list_files_controller_instances.files }}"
  loop_control:
    loop_var: __read_instances_definitions_item
  register: __contents_filetree_controller_instances
  failed_when: "'VARIABLE IS NOT DEFINED' in __contents_filetree_controller_instances"

- name: "Populate Instances list"
  ansible.builtin.set_fact:
    __populate_controller_instances: "{{ (__populate_controller_instances | default([])) + __populate_instances_list_item.ansible_facts.controller_instances }}"
  loop: "{{ __contents_filetree_controller_instances.results }}"
  loop_control:
    loop_var: __populate_instances_list_item
  no_log: "{{ controller_configuration_filetree_read_secure_logging }}"
  when:
    - __contents_filetree_controller_instances is defined
    - __contents_filetree_controller_instances.results is defined
    - __contents_filetree_controller_instances.results | length > 0
    - __populate_instances_list_item.ansible_facts.controller_instances is defined

- name: "Segregated Instances list when controller_location is defined"
  when: controller_location is defined and __populate_controller_instances is defined
  block:
    - name: "Populate Instances list by _common objects"
      ansible.builtin.set_fact:
        __populate_controller_instances_common: "{{ (__populate_controller_instances_common | default([])) + [__populate_instances_list_common_item] }}"
      loop: "{{ __populate_controller_instances }}"
      loop_control:
        loop_var: __populate_instances_list_common_item
      no_log: "{{ controller_configuration_filetree_read_secure_logging }}"
      when: "__populate_instances_list_common_item.controller_location is not defined"

    - name: "Populate Instances list by __site objects"
      ansible.builtin.set_fact:
        __populate_controller_instances_site: "{{ (__populate_controller_instances_site | default([])) + [__populate_instances_list_site_item] }}"
      loop: "{{ __populate_controller_instances }}"
      loop_control:
        loop_var: __populate_instances_list_site_item
      no_log: "{{ controller_configuration_filetree_read_secure_logging }}"
      when: "__populate_instances_list_site_item.controller_location is defined and __populate_instances_list_site_item.controller_location == controller_location"

    - name: "Concatenate Instances list common + site"
      ansible.builtin.set_fact:
        __populate_controller_instances_total: "{{ __populate_controller_instances_common | default([]) + __populate_controller_instances_site }}"
      no_log: "{{ controller_configuration_filetree_read_secure_logging }}"
      when: __populate_controller_instances_site is defined

    - name: "Set Instances Data Structure common + site concatenated"
      ansible.builtin.set_fact:
        __populate_controller_instances: "{{ __populate_controller_instances_total }}"
      no_log: "{{ controller_configuration_filetree_read_secure_logging }}"
      when: __populate_controller_instances_total is defined

- name: "Set Instances Data Structure"
  ansible.builtin.set_fact:
    controller_instances: "{{ __populate_controller_instances }}"
  no_log: "{{ controller_configuration_filetree_read_secure_logging }}"
  when: __populate_controller_instances is defined
...
