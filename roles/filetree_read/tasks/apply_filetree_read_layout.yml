---
# Resolve input layout and, for create/flatten, remap all filetree_* search roots
# to dir_orgs_vars (export root). Matches how tests/configs/fc and fcf point every
# path at a single tree root; orgs and env are unused in those modes.
#
# Layout values:
#   hierarchical (default) — dir_orgs_vars/orgs/env/{common|env}/…
#   create                 — filetree_create non-flatten export tree
#   flatten                — filetree_create flatten_output tree (same path remap)
#
# Deprecated: filetree_create_layout: true maps to create when the new layout
# var is still hierarchical.
- name: "Resolve filetree_read input layout"
  ansible.builtin.set_fact:
    __filetree_read_layout: >-
      {{
        controller_configuration_filetree_read_layout
        if (controller_configuration_filetree_read_layout | default('hierarchical')) in ['create', 'flatten']
        else (
          'create'
          if (filetree_create_layout | default(false) | bool)
          else (controller_configuration_filetree_read_layout | default('hierarchical'))
        )
      }}

- name: "Remap filetree_read paths to create/flatten export root"
  when: __filetree_read_layout in ['create', 'flatten']
  ansible.builtin.set_fact:
    filetree_gateway_authenticators: "{{ dir_orgs_vars }}"
    filetree_gateway_authenticator_maps: "{{ dir_orgs_vars }}"
    filetree_gateway_settings: "{{ dir_orgs_vars }}"
    filetree_aap_organizations: "{{ dir_orgs_vars }}"
    filetree_aap_applications: "{{ dir_orgs_vars }}"
    filetree_gateway_http_ports: "{{ dir_orgs_vars }}"
    filetree_gateway_service_clusters: "{{ dir_orgs_vars }}"
    filetree_gateway_service_keys: "{{ dir_orgs_vars }}"
    filetree_gateway_service_nodes: "{{ dir_orgs_vars }}"
    filetree_gateway_services: "{{ dir_orgs_vars }}"
    filetree_aap_teams: "{{ dir_orgs_vars }}"
    filetree_aap_user_accounts: "{{ dir_orgs_vars }}"
    filetree_gateway_role_definitions: "{{ dir_orgs_vars }}"
    filetree_gateway_role_team_assignments: "{{ dir_orgs_vars }}"
    filetree_gateway_role_user_assignments: "{{ dir_orgs_vars }}"
    filetree_gateway_routes: "{{ dir_orgs_vars }}"
    filetree_controller_settings: "{{ dir_orgs_vars }}"
    filetree_controller_labels: "{{ dir_orgs_vars }}"
    filetree_controller_credential_types: "{{ dir_orgs_vars }}"
    filetree_controller_credentials: "{{ dir_orgs_vars }}"
    filetree_controller_credential_input_sources: "{{ dir_orgs_vars }}"
    filetree_controller_notifications: "{{ dir_orgs_vars }}"
    filetree_controller_projects: "{{ dir_orgs_vars }}"
    filetree_controller_execution_environments: "{{ dir_orgs_vars }}"
    filetree_controller_inventories: "{{ dir_orgs_vars }}"
    filetree_controller_inventory_sources: "{{ dir_orgs_vars }}"
    filetree_controller_instance_groups: "{{ dir_orgs_vars }}"
    filetree_controller_instances: "{{ dir_orgs_vars }}"
    filetree_controller_hosts: "{{ dir_orgs_vars }}"
    filetree_controller_groups: "{{ dir_orgs_vars }}"
    filetree_controller_templates: "{{ dir_orgs_vars }}"
    filetree_controller_workflow_job_templates: "{{ dir_orgs_vars }}"
    filetree_controller_schedules: "{{ dir_orgs_vars }}"
    filetree_controller_roles: "{{ dir_orgs_vars }}"
    filetree_eda_credential_types: "{{ dir_orgs_vars }}"
    filetree_eda_credentials: "{{ dir_orgs_vars }}"
    filetree_eda_decision_environments: "{{ dir_orgs_vars }}"
    filetree_eda_event_streams: "{{ dir_orgs_vars }}"
    filetree_eda_projects: "{{ dir_orgs_vars }}"
    filetree_eda_rulebook_activations: "{{ dir_orgs_vars }}"
    filetree_hub_namespaces: "{{ dir_orgs_vars }}"
    filetree_hub_collections: "{{ dir_orgs_vars }}"
    filetree_hub_collection_remotes: "{{ dir_orgs_vars }}"
    filetree_hub_collection_repositories: "{{ dir_orgs_vars }}"
    filetree_hub_ee_registries: "{{ dir_orgs_vars }}"
    filetree_hub_ee_repositories: "{{ dir_orgs_vars }}"
